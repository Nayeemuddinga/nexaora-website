<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">NEXAORA X</title>
  <desc id="desc">NEXAORA circular X mark in cyan and white on black</desc>
  <defs>
    <linearGradient id="cyan" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#00b8f2"/>
      <stop offset="1" stop-color="#19c8ff"/>
    </linearGradient>
